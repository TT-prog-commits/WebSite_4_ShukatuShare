<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就活進捗シェア</title>
<style>
  :root{
    --bg:#f7f8fa;
    --card:#ffffff;
    --border:#e5e7eb;
    --text:#1f2937;
    --text-sub:#6b7280;
    --primary:#3b82f6;
    --primary-dark:#2563eb;
    --danger:#ef4444;
    --radius:14px;
    --stage-none:#eef0f3;
    --stage-none-text:#9ca3af;
    --stage-es:#dbeafe;
    --stage-web:#bfdbfe;
    --stage-1st:#93c5fd;
    --stage-2nd:#60a5fa;
    --stage-final:#3b82f6;
    --stage-offer:#22c55e;
    --stage-pray:#fca5a5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:110vh;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:960px;margin:0 auto;padding:16px 16px 80px;}
  header.top{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
    padding:14px 4px 18px;
  }
  header.top h1{font-size:18px;margin:0;font-weight:700;}
  .chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .user-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--border);
    padding:6px 12px;border-radius:999px;font-size:13px;color:var(--text-sub);
  }
  .user-chip b{color:var(--text);}
  .user-chip button{
    border:none;background:none;color:var(--primary);font-size:12px;cursor:pointer;padding:0;
  }
  nav.tabs{
    display:flex;gap:8px;margin-bottom:16px;
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;
  }
  nav.tabs button{
    flex:1;padding:10px;border:none;background:none;border-radius:9px;
    font-size:14px;font-weight:600;color:var(--text-sub);cursor:pointer;
    transition:all .15s;
  }
  nav.tabs button.active{background:var(--primary);color:#fff;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;
  }
  .card h2{font-size:15px;margin:0 0 4px;}
  .card p.desc{font-size:13px;color:var(--text-sub);margin:0 0 16px;}

  /* ---- center screens (name select / group code / setup / loading) ---- */
  .center-screen{
    min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px 0;
  }
  .name-card{
    width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:28px 24px;
  }
  .name-card h1{font-size:20px;margin:0 0 6px;}
  .name-card p{font-size:13px;color:var(--text-sub);margin:0 0 20px;line-height:1.6;}
  .name-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .name-list button{
    text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
    background:#fafafa;font-size:14px;cursor:pointer;font-weight:600;color:var(--text);
  }
  .name-list button:hover{border-color:var(--primary);background:#eff6ff;}
  .add-name-row{display:flex;gap:8px;}
  .add-name-row input{
    flex:1;padding:11px 12px;border-radius:10px;border:1px solid var(--border);font-size:14px;
  }
  .add-name-row button{
    padding:11px 16px;border-radius:10px;border:none;background:var(--primary);color:#fff;
    font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;
  }
  .add-name-row button:hover{background:var(--primary-dark);}
  .empty-hint{font-size:12px;color:var(--text-sub);margin-top:10px;}

  .setup-steps{font-size:13px;line-height:1.8;color:var(--text);background:#fafafa;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
  .setup-steps ol{margin:0;padding-left:20px;}
  .setup-steps code{background:#eef0f3;padding:1px 6px;border-radius:5px;font-size:12px;}
  .setup-steps pre{background:#1f2937;color:#e5e7eb;padding:12px 14px;border-radius:10px;font-size:11.5px;overflow-x:auto;white-space:pre;margin:8px 0;}
  .error-box{
    background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;
    padding:12px 14px;font-size:12.5px;margin-bottom:16px;line-height:1.6;
  }
  .spinner{
    width:28px;height:28px;border-radius:50%;border:3px solid var(--border);
    border-top-color:var(--primary);animation:spin .8s linear infinite;margin:0 auto 14px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .group-code-display{
    display:flex;align-items:center;gap:8px;background:#fafafa;border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;margin-bottom:16px;
  }
  .group-code-display .code{font-weight:800;font-size:16px;letter-spacing:.5px;flex:1;word-break:break-all;}
  .group-code-display button{
    border:none;background:var(--primary);color:#fff;padding:7px 12px;border-radius:8px;
    font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  }

  /* ---- matrix table ---- */
  .table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
  table{border-collapse:collapse;width:100%;min-width:520px;}
  th,td{padding:10px 12px;font-size:13px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
  thead th{background:#fafbfc;font-weight:700;color:var(--text-sub);position:sticky;top:0;}
  tbody th{
    text-align:left;font-weight:700;color:var(--text);background:#fafbfc;
    position:sticky;left:0;
  }
  td.stage-cell{font-weight:600;}
  .stage-badge{
    display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;
  }
  thead th .company-name-row{display:flex;align-items:center;justify-content:center;gap:4px;}
  thead th .company-name{font-size:13px;color:var(--text);}
  thead th a.company-name{color:var(--primary-dark);text-decoration:none;}
  thead th a.company-name:hover{text-decoration:underline;}
  thead th .company-updated{display:block;font-size:10px;font-weight:600;color:var(--text-sub);margin-top:2px;}
  .gear-btn{
    border:none;background:#eef0f3;color:var(--text-sub);width:18px;height:18px;line-height:18px;
    border-radius:50%;font-size:11px;cursor:pointer;padding:0;flex-shrink:0;
  }
  .gear-btn:hover{background:#e2e5ea;color:var(--text);}
  .matrix-pager{
    display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;
  }
  .matrix-pager button{
    border:1px solid var(--border);background:#fafafa;color:var(--text);
    padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .matrix-pager button:disabled{opacity:.4;cursor:default;}
  .matrix-pager .page-indicator{font-size:12px;color:var(--text-sub);font-weight:600;}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .legend .stage-badge{font-weight:600;}
  .stage-cell.own .stage-badge{cursor:pointer;border:2px solid transparent;}
  .stage-cell.own .stage-badge:hover{border-color:var(--primary);}
  .stage-cell.own .stage-badge{appearance:none;font-family:inherit;}

  /* ---- inline update popover on matrix ---- */
  .popover-overlay{position:fixed;inset:0;z-index:40;background:transparent;}
  .popover{
    position:fixed;z-index:50;background:var(--card);border:1px solid var(--border);
    border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px;
    max-width:260px;
  }
  .popover .popover-title{font-size:11px;color:var(--text-sub);font-weight:700;margin:0 2px 8px;}
  .popover .stage-buttons button{font-size:12px;padding:6px 10px;}
  .popover select{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;background:#fff;
  }
  .popover input[type="url"], .popover input[type="text"]{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;
  }

  /* ---- industry filter & tag ---- */
  .filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-bar label{font-size:12px;color:var(--text-sub);font-weight:700;}
  .filter-bar select{
    padding:8px 10px;border-radius:9px;border:1px solid var(--border);font-size:13px;background:#fff;
  }
  .industry-tag{
    display:inline-block;font-size:10px;font-weight:700;color:var(--text-sub);
    background:#eef0f3;padding:2px 8px;border-radius:999px;margin-top:4px;
  }
  .type-tag{
    display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:4px;margin-right:4px;
  }
  .type-tag.main{background:#dbeafe;color:#1d4ed8;}
  .type-tag.intern{background:#fef3c7;color:#b45309;}
  .type-toggle{
    display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;
  }
  .type-toggle button{
    border:none;background:none;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
    color:var(--text-sub);cursor:pointer;
  }
  .type-toggle button.active{background:var(--primary);color:#fff;}

  .popover .field-label{font-size:11px;color:var(--text-sub);font-weight:700;margin:8px 2px 4px;display:block;}
  .popover .save-url-btn{
    margin-top:8px;width:100%;padding:8px;border-radius:8px;border:none;background:var(--primary);
    color:#fff;font-weight:600;font-size:12.5px;cursor:pointer;
  }
  .popover .divider{border:none;border-top:1px solid var(--border);margin:12px 0;}
  .popover .delete-btn{
    width:100%;padding:8px;border-radius:8px;border:1px solid var(--danger);background:#fff;
    color:var(--danger);font-weight:600;font-size:12.5px;cursor:pointer;
  }
  .popover .confirm-row{display:flex;gap:8px;}
  .popover .confirm-row button{flex:1;padding:8px;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer;}
  .popover .confirm-yes{border:none;background:var(--danger);color:#fff;}
  .popover .confirm-no{border:1px solid var(--border);background:#fff;color:var(--text);}

  /* ---- results screen ---- */
  .result-summary{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .result-summary .stat{
    flex:1;min-width:120px;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;
  }
  .result-summary .stat .num{font-size:24px;font-weight:800;}
  .result-summary .stat .lbl{font-size:12px;color:var(--text-sub);margin-top:2px;}
  .result-list{display:flex;flex-direction:column;gap:8px;}
  .result-item{
    display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;
  }
  .result-item .r-main{flex:1;min-width:0;}
  .result-item .r-company{font-weight:700;font-size:14px;}
  .result-item .r-sub{font-size:12px;color:var(--text-sub);margin-top:2px;}
  .result-item .r-date{font-size:11px;color:var(--text-sub);white-space:nowrap;}

  /* ---- update screen ---- */
  .company-row{
    border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;
  }
  .company-row .company-head{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  }
  .company-row .company-head .cname{font-weight:700;font-size:14px;}
  .company-row .company-head .updated{font-size:11px;color:var(--text-sub);}
  .login-id-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .login-id-row label{font-size:11px;color:var(--text-sub);font-weight:700;white-space:nowrap;}
  .login-id-row input{
    flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;
  }
  .stage-buttons{display:flex;flex-wrap:wrap;gap:6px;}
  .stage-buttons button{
    border:1px solid var(--border);background:#fafafa;color:var(--text);
    padding:7px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;font-weight:600;
  }
  .stage-buttons button.selected{border-color:transparent;color:#111827;}
  .add-company-form{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .add-company-form input{
    flex:1;min-width:160px;padding:11px 12px;border-radius:10px;border:1px solid var(--border);font-size:14px;
  }
  .add-company-form select{
    padding:11px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px;background:#fff;
  }
  .add-company-form button{
    padding:11px 16px;border-radius:10px;border:none;background:var(--primary);color:#fff;
    font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;
  }
  .empty-state{
    text-align:center;padding:40px 16px;color:var(--text-sub);font-size:13px;
  }
  footer.note{
    text-align:center;font-size:11px;color:var(--text-sub);padding:20px 0 40px;
  }
</style>
</head>
<body>

<div id="root"></div>

<script type="module">
/* =========================================================================
   就活進捗シェアサイト — 複数端末・複数人でリアルタイム共有 (Firebase版)

   仕組み:
   - Firebase (Firestore) を「みんなが読み書きできる保管庫」として使用。
   - 「グループコード」を仲間内で決めて共有すると、同じコードを入れた
     全員の端末が同じデータ（メンバー・企業・進捗）を見られる。
   - ログインは無し。グループコード → 自分の名前を選ぶ、だけで使える。

   使い始めるには、下の CONFIG セクションに自分の Firebase プロジェクトの
   設定値を貼り付ける必要があります。詳しい手順はアプリ内の案内画面、
   および納品時のメッセージを参照してください。
   ========================================================================= */

/* ============================ CONFIG ============================
   ここに自分の Firebase プロジェクトの設定値を貼り付けてください。
   Firebase コンソール → プロジェクトの設定 → 全般 → マイアプリ
   → 「SDK の設定と構成」→「構成」を選ぶと、この形の値が表示されます。
   ================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBTPeCK0Osrqub85XhXRdjRQilYTF2weXM",
  authDomain: "syuukatushare.firebaseapp.com",
  projectId: "syuukatushare",
  storageBucket: "syuukatushare.firebasestorage.app",
  messagingSenderId: "40616773178",
  appId: "1:40616773178:web:18400580b5318f2fe61703",
};
/* ================================================================== */

const FIREBASE_NOT_CONFIGURED = firebaseConfig.apiKey === "YOUR_API_KEY";

let app = null, db = null;
let firestoreFns = null;

if(!FIREBASE_NOT_CONFIGURED){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  firestoreFns = fs;
  app = initializeApp(firebaseConfig);
  db = fs.getFirestore(app);
}

const GROUP_CODE_KEY = "syukatu_group_code_v1";
const CURRENT_USER_KEY = "syukatu_current_user_v1";
const REGISTERED_NAME_PREFIX = "syukatu_registered_name_";

function getDeviceRegisteredName(){
  return localStorage.getItem(REGISTERED_NAME_PREFIX + state.groupCode) || "";
}
function setDeviceRegisteredName(name){
  localStorage.setItem(REGISTERED_NAME_PREFIX + state.groupCode, name);
}

const STAGES = [
  { key: "es",     label: "ES提出",   color: "var(--stage-es)" },
  { key: "web",    label: "Webテスト", color: "var(--stage-web)" },
  { key: "1st",    label: "一次面接", color: "var(--stage-1st)" },
  { key: "2nd",    label: "二次面接", color: "var(--stage-2nd)" },
  { key: "final",  label: "最終面接", color: "var(--stage-final)" },
  { key: "offer",  label: "内定",     color: "var(--stage-offer)" },
  { key: "pray",   label: "お祈り",   color: "var(--stage-pray)" },
];
const STAGE_MAP = Object.fromEntries(STAGES.map(s => [s.key, s]));
const RESULT_STAGE_KEYS = ["offer", "pray"];

const INDUSTRIES = [
  "IT・通信", "メーカー", "商社", "金融", "コンサル",
  "広告・マスコミ", "小売・流通", "インフラ", "官公庁・公務員", "サービス", "その他",
];
const NO_INDUSTRY = "未設定";

const COMPANY_TYPES = ["本選考", "インターン"];
const DEFAULT_COMPANY_TYPE = "本選考";

function docIdFor(str){ return encodeURIComponent(str); }
function recordKey(member, company){ return member + "___" + company; }

/* ---------------- Firestore refs ---------------- */
function groupRef(){ return firestoreFns.doc(db, "groups", state.groupCode); }
function companiesCol(){ return firestoreFns.collection(db, "groups", state.groupCode, "companies"); }
function recordsCol(){ return firestoreFns.collection(db, "groups", state.groupCode, "records"); }
function companyDocRef(company){ return firestoreFns.doc(db, "groups", state.groupCode, "companies", docIdFor(company)); }
function recordDocRef(member, company){ return firestoreFns.doc(db, "groups", state.groupCode, "records", docIdFor(recordKey(member, company))); }

const state = {
  groupCode: localStorage.getItem(GROUP_CODE_KEY) || "",
  currentUser: sessionStorage.getItem(CURRENT_USER_KEY) || "",
  members: [],
  companies: [], // [{ name, url, industry, createdAt }]
  records: {},   // recordKey -> { member, company, stage?, updatedAt?, loginId? }
  readyGroup: false,
  readyCompanies: false,
  readyRecords: false,
  connectError: null,
  tab: "list",
  popover: null,
  companyManage: null,
  companyPage: 0,
  industryFilter: "",
  typeFilter: "", // "" = すべて, or "本選考" / "インターン"
  nameFormError: "",
};

const COMPANIES_PER_PAGE = 5;

let unsubGroup = null, unsubCompanies = null, unsubRecords = null;

function isReady(){ return state.readyGroup && state.readyCompanies && state.readyRecords; }

function handleError(err){
  console.error(err);
  state.connectError = err && err.message ? err.message : String(err);
  render();
}

function connectToGroup(code){
  if(unsubGroup) unsubGroup();
  if(unsubCompanies) unsubCompanies();
  if(unsubRecords) unsubRecords();

  state.groupCode = code;
  localStorage.setItem(GROUP_CODE_KEY, code);
  state.members = [];
  state.companies = [];
  state.records = {};
  state.readyGroup = false;
  state.readyCompanies = false;
  state.readyRecords = false;
  state.connectError = null;
  render();

  const { onSnapshot } = firestoreFns;

  unsubGroup = onSnapshot(groupRef(), (snap)=>{
    state.members = (snap.exists() && snap.data().members) || [];
    state.readyGroup = true;
    render();
  }, handleError);

  unsubCompanies = onSnapshot(companiesCol(), (snap)=>{
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    list.sort((a, b) => (a.createdAt || "") < (b.createdAt || "") ? -1 : 1);
    state.companies = list;
    state.readyCompanies = true;
    render();
  }, handleError);

  unsubRecords = onSnapshot(recordsCol(), (snap)=>{
    const map = {};
    snap.forEach(d => { const r = d.data(); map[recordKey(r.member, r.company)] = r; });
    state.records = map;
    state.readyRecords = true;
    render();
  }, handleError);
}

function leaveGroup(){
  if(unsubGroup) unsubGroup();
  if(unsubCompanies) unsubCompanies();
  if(unsubRecords) unsubRecords();
  unsubGroup = unsubCompanies = unsubRecords = null;
  state.groupCode = "";
  state.currentUser = "";
  state.nameFormError = "";
  localStorage.removeItem(GROUP_CODE_KEY);
  sessionStorage.removeItem(CURRENT_USER_KEY);
  render();
}

/* ---------------- Data helpers (read) ---------------- */
function companyNames(){ return state.companies.map(c => c.name); }
function findCompany(name){ return state.companies.find(c => c.name === name); }
function getCompanyUrl(name){ const c = findCompany(name); return (c && c.url) || ""; }
function getCompanyIndustry(name){ const c = findCompany(name); return (c && c.industry) || NO_INDUSTRY; }
function getCompanyType(name){ const c = findCompany(name); return (c && c.type) || DEFAULT_COMPANY_TYPE; }
function getRecord(member, company){ return state.records[recordKey(member, company)] || null; }
function getLoginId(member, company){ const r = getRecord(member, company); return (r && r.loginId) || ""; }
function companyLastUpdated(company){
  let latest = null;
  Object.values(state.records).forEach(r=>{
    if(r.company === company && r.updatedAt && (!latest || r.updatedAt > latest)) latest = r.updatedAt;
  });
  return latest;
}

/* ---------------- Data helpers (write) ---------------- */
async function addMember(name){
  if(state.members.includes(name)) return;
  state.members = [...state.members, name];
  render();
  await firestoreFns.setDoc(groupRef(), { members: firestoreFns.arrayUnion(name) }, { merge: true });
}

async function addCompany(name, industry, type){
  const companyType = type || DEFAULT_COMPANY_TYPE;
  if(!companyNames().includes(name)){
    state.companies = [...state.companies, { id: docIdFor(name), name, url: "", industry: industry || "", type: companyType, createdAt: new Date().toISOString() }];
    render();
  }
  const payload = { name, type: companyType, createdAt: new Date().toISOString() };
  if(industry) payload.industry = industry;
  await firestoreFns.setDoc(companyDocRef(name), payload, { merge: true });
}

async function setCompanyUrl(name, url){
  await firestoreFns.setDoc(companyDocRef(name), { name, url }, { merge: true });
}

async function setCompanyIndustry(name, industry){
  await firestoreFns.setDoc(companyDocRef(name), { name, industry }, { merge: true });
}

async function setCompanyType(name, type){
  await firestoreFns.setDoc(companyDocRef(name), { name, type }, { merge: true });
}

async function deleteCompany(name){
  const relatedKeys = Object.keys(state.records).filter(k => state.records[k].company === name);
  state.companies = state.companies.filter(c => c.name !== name);
  relatedKeys.forEach(k => delete state.records[k]);
  render();

  const deletions = [firestoreFns.deleteDoc(companyDocRef(name))];
  for(const key of relatedKeys){
    const sep = key.indexOf("___");
    const member = key.slice(0, sep);
    deletions.push(firestoreFns.deleteDoc(recordDocRef(member, name)));
  }
  await Promise.all(deletions);
}

async function setRecord(member, company, stageKey){
  const key = recordKey(member, company);
  state.records[key] = { ...(state.records[key] || {}), member, company, stage: stageKey, updatedAt: new Date().toISOString() };
  render();
  await firestoreFns.setDoc(recordDocRef(member, company), {
    member, company, stage: stageKey, updatedAt: new Date().toISOString(),
  }, { merge: true });
}

async function clearStage(member, company){
  const key = recordKey(member, company);
  const existing = state.records[key];
  if(!existing) return;
  const hadLoginId = !!existing.loginId;
  if(hadLoginId){
    state.records[key] = { member, company, loginId: existing.loginId };
  }else{
    delete state.records[key];
  }
  render();

  if(hadLoginId){
    await firestoreFns.setDoc(recordDocRef(member, company), {
      member, company, loginId: existing.loginId,
      stage: firestoreFns.deleteField(), updatedAt: firestoreFns.deleteField(),
    }, { merge: true });
  }else{
    await firestoreFns.deleteDoc(recordDocRef(member, company));
  }
}

async function setLoginId(member, company, loginId){
  const key = recordKey(member, company);
  const existing = state.records[key];
  if(!loginId && !(existing && existing.stage)){
    delete state.records[key];
    render();
    await firestoreFns.deleteDoc(recordDocRef(member, company));
    return;
  }
  state.records[key] = { ...(existing || {}), member, company, loginId };
  render();
  if(loginId){
    await firestoreFns.setDoc(recordDocRef(member, company), { member, company, loginId }, { merge: true });
  }else{
    await firestoreFns.setDoc(recordDocRef(member, company), { member, company, loginId: firestoreFns.deleteField() }, { merge: true });
  }
}

function formatDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v === null || v === undefined) continue;
    if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c=>{
    if(c === null || c === undefined) return;
    if(typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

/* ---------------- Group code screen ---------------- */
function generateGroupCode(){
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  const arr = new Uint32Array(14);
  crypto.getRandomValues(arr);
  return Array.from(arr, n => chars[n % chars.length]).join("");
}

    pop.appendChild(industrySelect);

    pop.appendChild(el("label", { class: "field-label" }, "企業のWebサイトURL"));
    const urlInput = el("input", { type: "url", placeholder: "https://example.com", value: getCompanyUrl(company) });
    pop.appendChild(urlInput);
    pop.appendChild(el("button", {
      class: "save-url-btn",
      onclick: ()=>{
        setCompanyUrl(company, urlInput.value.trim());
        state.companyManage = null;
        render();
      }
    }, "URLを保存"));

    pop.appendChild(el("hr", { class: "divider" }));
    pop.appendChild(el("button", {
      class: "delete-btn",
      onclick: ()=>{ state.companyManage.confirmDelete = true; render(); }
    }, "この企業を削除する"));
  }else{
    pop.appendChild(el("p", { class: "field-label", style: "color:var(--danger);" },
      `「${company}」を削除すると、全員の進捗データも削除されます。よろしいですか？`));
    const row = el("div", { class: "confirm-row" });
    row.appendChild(el("button", {
      class: "confirm-no",
      onclick: ()=>{ state.companyManage.confirmDelete = false; render(); }
    }, "キャンセル"));
    row.appendChild(el("button", {
      class: "confirm-yes",
      onclick: ()=>{
        deleteCompany(company);
        state.companyManage = null;
        render();
      }
    }, "削除する"));
    pop.appendChild(row);
  }

  frag.appendChild(pop);
  return frag;
}

function renderMatrixPopover(){
  const frag = document.createDocumentFragment();
  const { company, rect } = state.popover;
  const rec = getRecord(state.currentUser, company);

  frag.appendChild(el("div", {
    class: "popover-overlay",
    onclick: ()=>{ state.popover = null; render(); }
  }));

  const pop = el("div", {
    class: "popover",
    style: `top:${rect.top}px;left:${rect.left}px;`
  });
  pop.appendChild(el("p", { class: "popover-title" }, `${company} のステージを更新`));

  pop.appendChild(el("label", { class: "field-label" }, "この企業でのログインID"));
  const idInput = el("input", { type: "text", placeholder: "ログインID（任意）", value: rec && rec.loginId ? rec.loginId : "" });
  pop.appendChild(idInput);
  pop.appendChild(el("button", {
    class: "save-url-btn",
    onclick: ()=>{
      setLoginId(state.currentUser, company, idInput.value.trim());
      render();
    }
  }, "IDを保存"));
  pop.appendChild(el("hr", { class: "divider" }));

  const btnRow = el("div", { class: "stage-buttons" });
  btnRow.appendChild(el("button", {
    class: !(rec && rec.stage) ? "selected" : "",
    style: !(rec && rec.stage) ? "background:var(--stage-none);border-color:var(--stage-none);" : "",
    onclick: ()=>{
      clearStage(state.currentUser, company);
      state.popover = null;
      render();
    }
  }, "未エントリー"));
  STAGES.forEach(s=>{
    const selected = rec && rec.stage === s.key;
    btnRow.appendChild(el("button", {
      class: selected ? "selected" : "",
      style: selected ? `background:${s.color};border-color:${s.color};` : "",
      onclick: ()=>{
        setRecord(state.currentUser, company, s.key);
        state.popover = null;
        render();
      }
    }, s.label));
  });
  pop.appendChild(btnRow);
  frag.appendChild(pop);
  return frag;
}

/* ---------------- Add / update screen ---------------- */
function renderEditScreen(){
  const container = document.createDocumentFragment();

  const addCard = el("div", { class: "card" });
  addCard.appendChild(el("h2", {}, "企業を追加"));
  addCard.appendChild(el("p", { class: "desc" }, "追加した企業はグループ全員の一覧表に列として表示されます。"));
  let selectedType = DEFAULT_COMPANY_TYPE;
  const typeToggle = el("div", { class: "type-toggle" });
  COMPANY_TYPES.forEach(t=>{
    typeToggle.appendChild(el("button", {
      class: t === selectedType ? "active" : "",
      onclick: (e)=>{
        selectedType = t;
        typeToggle.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        e.currentTarget.classList.add("active");
      }
    }, t));
  });
  addCard.appendChild(typeToggle);

  const form = el("div", { class: "add-company-form" });
  const input = el("input", { type: "text", placeholder: "企業名を入力（例：〇〇株式会社）" });
  const industrySelect = el("select", {});
  industrySelect.appendChild(el("option", { value: "" }, "業界を選択（任意）"));
  INDUSTRIES.forEach(ind => industrySelect.appendChild(el("option", { value: ind }, ind)));
  form.appendChild(input);
  form.appendChild(industrySelect);
  form.appendChild(el("button", {
    onclick: ()=>{
      const name = input.value.trim();
      if(!name) return;
      addCompany(name, industrySelect.value, selectedType);
      input.value = "";
      industrySelect.value = "";
      selectedType = DEFAULT_COMPANY_TYPE;
      typeToggle.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.textContent === DEFAULT_COMPANY_TYPE));
    }
  }, "追加"));
  addCard.appendChild(form);
  container.appendChild(addCard);

  const updateCard = el("div", { class: "card" });
  updateCard.appendChild(el("h2", {}, "自分の選考ステージを更新"));
  updateCard.appendChild(el("p", { class: "desc" }, `${state.currentUser} さんの各企業のステージをタップして更新してください。`));

  const companies = companyNames();
  if(companies.length === 0){
    updateCard.appendChild(el("div", { class: "empty-state" }, "まだ企業がありません。上のフォームから追加してください。"));
  }else{
    companies.forEach(company=>{
      const rec = getRecord(state.currentUser, company);
      const hasStage = rec && rec.stage;
      const row = el("div", { class: "company-row" });
      const head = el("div", { class: "company-head" });
      head.appendChild(el("span", { class: "cname" }, company));
      head.appendChild(el("span", { class: "updated" }, hasStage ? `更新: ${formatDate(rec.updatedAt)}` : "未エントリー"));
      row.appendChild(head);

      const idRow = el("div", { class: "login-id-row" });
      idRow.appendChild(el("label", {}, "ログインID"));
      const idInput = el("input", { type: "text", placeholder: "この企業でのログインID（任意）", value: getLoginId(state.currentUser, company) });
      idInput.addEventListener("blur", ()=>{ setLoginId(state.currentUser, company, idInput.value.trim()); });
      idRow.appendChild(idInput);
      row.appendChild(idRow);

      const btnRow = el("div", { class: "stage-buttons" });
      STAGES.forEach(s=>{
        const selected = hasStage && rec.stage === s.key;
        btnRow.appendChild(el("button", {
          class: selected ? "selected" : "",
          style: selected ? `background:${s.color};border-color:${s.color};` : "",
          onclick: ()=>{ setRecord(state.currentUser, company, s.key); }
        }, s.label));
      });
      row.appendChild(btnRow);
      updateCard.appendChild(row);
    });
  }
  container.appendChild(updateCard);

  return container;
}

/* ---------------- Results screen (offers & rejections) ---------------- */
function renderResultsScreen(){
  const container = document.createDocumentFragment();
  const card = el("div", { class: "card" });
  card.appendChild(el("h2", {}, "内定・お祈り結果"));
  card.appendChild(el("p", { class: "desc" }, "選考が「内定」または「お祈り」で確定したものだけを、日付が新しい順にまとめて表示します。"));

  const companies = companyNames();
  const results = [];
  Object.values(state.records).forEach(rec=>{
    if(!rec.stage || !RESULT_STAGE_KEYS.includes(rec.stage)) return;
    if(!companies.includes(rec.company)) return; // company may have been deleted
    results.push({ member: rec.member, company: rec.company, stage: rec.stage, updatedAt: rec.updatedAt });
  });
  results.sort((a, b) => (a.updatedAt < b.updatedAt ? 1 : -1));

  const offerCount = results.filter(r => r.stage === "offer").length;
  const prayCount = results.filter(r => r.stage === "pray").length;

  const summary = el("div", { class: "result-summary" });
  const offerStat = el("div", { class: "stat" });
  offerStat.appendChild(el("div", { class: "num", style: "color:var(--stage-offer);" }, String(offerCount)));
  offerStat.appendChild(el("div", { class: "lbl" }, "内定（全員合計）"));
  summary.appendChild(offerStat);
  const prayStat = el("div", { class: "stat" });
  prayStat.appendChild(el("div", { class: "num", style: "color:#ef4444;" }, String(prayCount)));
  prayStat.appendChild(el("div", { class: "lbl" }, "お祈り（全員合計）"));
  summary.appendChild(prayStat);
  card.appendChild(summary);

  const members = state.members;
  if(members.length > 0){
    const perMember = {};
    members.forEach(m => { perMember[m] = { offer: 0, pray: 0 }; });
    results.forEach(r=>{
      if(!perMember[r.member]) perMember[r.member] = { offer: 0, pray: 0 };
      perMember[r.member][r.stage]++;
    });

    card.appendChild(el("h2", { style: "margin-top:22px;margin-bottom:10px;" }, "メンバー別の内訳"));
    const tableWrap = el("div", { class: "table-wrap" });
    const table = el("table");
    const thead = el("thead");
    const headRow = el("tr");
    headRow.appendChild(el("th", {}, "メンバー"));
    headRow.appendChild(el("th", {}, "内定"));
    headRow.appendChild(el("th", {}, "お祈り"));
    thead.appendChild(headRow);
    table.appendChild(thead);
    const tbody = el("tbody");
    members.forEach(m=>{
      const row = el("tr");
      row.appendChild(el("th", {}, m));
      const c = perMember[m];
      row.appendChild(el("td", { class: "stage-cell" }, el("span", {
        class: "stage-badge", style: "background:var(--stage-offer);color:#1f2937;"
      }, String(c.offer))));
      row.appendChild(el("td", { class: "stage-cell" }, el("span", {
        class: "stage-badge", style: "background:var(--stage-pray);color:#1f2937;"
      }, String(c.pray))));
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    card.appendChild(tableWrap);
  }

  card.appendChild(el("h2", { style: "margin-top:22px;margin-bottom:4px;" }, "個別の結果一覧"));

  if(results.length === 0){
    card.appendChild(el("div", { class: "empty-state" }, "まだ内定・お祈りの結果はありません。"));
  }else{
    const list = el("div", { class: "result-list" });
    results.forEach(r=>{
      const s = STAGE_MAP[r.stage];
      const item = el("div", { class: "result-item" });
      const main = el("div", { class: "r-main" });
      main.appendChild(el("div", { class: "r-company" }, r.company));
      main.appendChild(el("div", { class: "r-sub" }, `${r.member} ・ ${getCompanyType(r.company)} ・ ${getCompanyIndustry(r.company)}`));
      item.appendChild(main);
      item.appendChild(el("span", { class: "stage-badge", style: `background:${s.color};color:#1f2937;` }, s.label));
      item.appendChild(el("span", { class: "r-date" }, formatDate(r.updatedAt)));
      list.appendChild(item);
    });
    card.appendChild(list);
  }

  container.appendChild(card);
  return container;
}

/* ---------------- Boot ---------------- */
render();
if(!FIREBASE_NOT_CONFIGURED && state.groupCode){
  connectToGroup(state.groupCode);
}
</script>
